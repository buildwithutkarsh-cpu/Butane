name: Build Butane

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Set version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $v = '1.0.0'
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build installer
        shell: pwsh
        run: ./BuildInstaller.ps1 -AppVersion ${{ steps.ver.outputs.version }}

      - name: Create stable-name copy
        shell: pwsh
        run: Copy-Item "dist/Butane-Setup-${{ steps.ver.outputs.version }}.exe" "dist/Butane-Setup.exe"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Butane-Setup
          path: dist/*.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Butane-Setup.exe
            dist/Butane-Setup-${{ steps.ver.outputs.version }}.exe
