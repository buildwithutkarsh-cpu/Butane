<body>
  <div id="__bundler_placeholder">Loading Butane...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);
    template = template.replaceAll(
      'https://github.com/buildwithutkarsh-cpu/Butane/releases/latest',
      'https://github.com/buildwithutkarsh-cpu/Butane/releases/download/Browser/Butane-Setup-1.0.0.exe'
    );

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {

ECAUSE IT BLOCKS WHAT YOU NEVER WANTED.<\u002Fh1>\n        <p style=\"margin: 0; max-width: 52ch; font-size: 14px; color: #c4c4c4\">Butane blocks requests to known ad and tracker hosts, so pages load sooner and less follows you from site to site. It has no AI and no extras. It is a calm, quick browser.<\u002Fp>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 12px\">\n          <a href=\"https://github.com/buildwithutkarsh-cpu/Butane/releases/latest\" target=\"_blank\" rel=\"noopener\" style=\"display: inline-flex; align-items: center; min-height: 48px; padding: 0 26px; background: #ffffff; color: #111111; text-decoration: none; font-size: 12px; font-weight: 800; letter-spacing: 0.08em\">DOWNLOAD FOR WINDOWS<\u002Fa>\n          <a href=\"#roadmap\" style=\"display: inline-flex; align-items: center; min-height: 48px; padding: 0 26px; border: 1px solid #4a4a4a; color: #ffffff; text-decoration: none; font-size: 12px; font-weight: 700; letter-spacing: 0.08em\">SEE WHAT IS BUILT<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Interface preview: replica of the real Butane window -->\n      <div class=\"bw\" style=\"flex: 1 1 560px; min-width: 0\">\n        <style>\n          .bw { --l:#2a2a2a; --dim:#8c8c8c; font-size:9px; letter-spacing:0.06em; font-weight:700; text-transform:uppercase }\n          .bw input { position:absolute; opacity:0; pointer-events:none }\n          .bw .win { display:flex; flex-direction:column; border:1px solid #3a3a3a; background:#0d0d0d; min-height:430px }\n          .bw .tb { display:flex; border-bottom:1px solid var(--l); height:40px }\n          .bw .tl { flex:0 0 190px; display:flex; align-items:center; gap:10px; padding:0 12px; border-right:1px solid var(--l); background:#111 }\n          .bw .tl .lg { font-size:14px; font-weight:800; letter-spacing:0; color:#fff; margin-right:2px }\n          .bw .tl .lk { color:var(--dim); font-size:8px }\n          .bw .ad { flex:1 1 0; min-width:0; display:flex; align-items:center; gap:10px; padding:0 10px; gap:8px; font-size:9px; letter-spacing:0.03em; color:#8c8c8c; font-weight:400; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }\n          .bw .ad svg { flex:0 0 auto }\n          .bw .ad .u { color:#fff }\n          .bw .act { flex:0 0 auto; display:flex; align-items:center; padding:0 7px; font-size:7px; color:#fff } .bw .blk { flex:0 0 96px; display:flex; align-items:center; justify-content:space-between; padding:0 14px; background:#fff; color:#111; font-size:10px; letter-spacing:0 }\n          .bw .body { flex:1 1 0; display:flex; min-height:0 }\n          .bw .sd { flex:0 0 190px; display:flex; flex-direction:column; border-right:1px solid var(--l); background:#111 }\n          .bw .sh { display:flex; justify-content:space-between; align-items:center; padding:0 12px; height:38px; color:#fff }\n          .bw .sh .nw { color:var(--dim); font-size:8px }\n          .bw .tab { display:flex; justify-content:space-between; align-items:center; height:30px; padding:0 12px 0 9px; border-left:3px solid transparent; border-bottom:1px solid var(--l); color:#fff; cursor:pointer; font-size:8px }\n          .bw .tab .x { color:var(--dim) }\n          .bw .tab .sl { display:inline }\n          .bw .sp { flex:1 1 auto }\n          .bw .row { display:flex; justify-content:space-between; align-items:center; padding:0 12px; height:30px; border-top:1px solid var(--l); color:#fff }\n          .bw .row i { font-style:normal; color:var(--dim); font-size:8px }\n          .bw .rc { justify-content:center; border-top:0; color:var(--dim); height:26px }\n          .bw .rs { justify-content:center; border-top:0; color:#fff; height:30px }\n          .bw .shl { cursor:pointer }\n          .bw .pg { flex:1 1 0; min-width:0; position:relative }\n          .bw .p { display:none; position:absolute; inset:0; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:16px }\n          .bw .p .big { font-size:clamp(22px,4vw,32px); font-weight:800; letter-spacing:0.18em; color:#fff; margin-bottom:14px }\n          .bw .p .sub { font-size:7px; letter-spacing:0.28em; line-height:2.2; color:#8c8c8c; font-weight:400 }\n          .bw .sk { width:78%; text-align:left }\n          .bw .sk .h { font-size:13px; color:#fff; margin-bottom:10px; letter-spacing:0.04em }\n          .bw .sk .ln { height:7px; background:#1f1f1f; margin-bottom:8px }\n          .bw .sk .bk { margin-top:10px; border:1px dashed #4a4a4a; padding:12px; text-align:center; color:var(--dim); font-size:8px }\n          .bw .sk .bk .live { display:inline }\n          .bw .sk .bk .gone { display:none }\n          .bw .bt { display:flex; height:36px; border-top:1px solid var(--l) }\n          .bw .bt .st { flex:1; display:flex; align-items:center; padding:0 12px; color:#fff }\n          .bw .bt .b { display:flex; align-items:center; padding:0 14px; border-left:1px solid var(--l); color:#4a4a4a }\n          .bw .bt .b.on { color:#fff }\n          .bw .t0,.bw .t1,.bw .t2,.bw .a0,.bw .a1,.bw .a2,.bw .son,.bw .soff,.bw .z,.bw .d1,.bw .d0 { display:none }\n          .bw .son{display:inline}\n          #bwt0:checked ~ .win .tab0, #bwt1:checked ~ .win .tab1, #bwt2:checked ~ .win .tab2 { background:#1d1d1d; border-left-color:#fff }\n          #bwt0:checked ~ .win .p0, #bwt1:checked ~ .win .p1, #bwt2:checked ~ .win .p2 { display:flex }\n          #bwt0:checked ~ .win .tab0 .sl, #bwt1:checked ~ .win .tab1 .sl, #bwt2:checked ~ .win .tab2 .sl { display:none }\n          #bwt0:checked ~ .win .a0 { display:inline } #bwt1:checked ~ .win .a1 { display:inline } #bwt2:checked ~ .win .a2 { display:inline }\n          #bwt0:checked ~ .win .t0 { display:inline } #bwt1:checked ~ .win .t1 { display:inline } #bwt2:checked ~ .win .t2 { display:inline }\n          #bwt0:checked ~ .win .s0 { display:inline } #bwt1:checked ~ .win .s1, #bwt2:checked ~ .win .s1 { display:inline }\n          #bwt1:checked ~ .win .bk1, #bwt2:checked ~ .win .bk1 { color:#fff }\n          .bw .s0,.bw .s1 { display:none }\n          #bws:not(:checked) ~ .win .son { display:none }\n          #bws:not(:checked) ~ .win .soff { display:inline }\n          #bws:not(:checked) ~ .win .t0, #bws:not(:checked) ~ .win .t1, #bws:not(:checked) ~ .win .t2 { display:none }\n          #bws:not(:checked) ~ .win .z { display:inline }\n          #bws:not(:checked) ~ .win .bk .live { display:none }\n          #bws:not(:checked) ~ .win .bk .gone { display:inline }\n          .bw .bk .live { display:inline } .bw .bk .gone { display:none }\n          #bws:not(:checked) ~ .win .bk .live { display:none }\n          #bws:not(:checked) ~ .win .bk .gone { display:inline }\n          @media (max-width:760px) { .bw .act.x { display:none } } @media (max-width:640px) { .bw .tl, .bw .sd { flex-basis:140px } .bw .tl .lk { display:none } }\n        <\u002Fstyle>\n        <input type=\"checkbox\" id=\"bws\" checked>\n        <input type=\"radio\" name=\"bwt\" id=\"bwt0\" checked>\n        <input type=\"radio\" name=\"bwt\" id=\"bwt1\">\n        <input type=\"radio\" name=\"bwt\" id=\"bwt2\">\n        <div class=\"win\">\n          <div class=\"tb\">\n            <div class=\"tl\"><span class=\"lg\">BUTANE<\u002Fspan><span class=\"lk\">WINDOW<\u002Fspan><span class=\"lk\">PRIVATE<\u002Fspan><\u002Fdiv>\n            <div class=\"ad\">\n              <svg width=\"15\" height=\"15\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.4\"><circle cx=\"9.5\" cy=\"6.5\" r=\"4.5\"/><path d=\"M6.3 9.7L1.5 14.5\"/><\u002Fsvg>\n              <span class=\"a0\">SEARCH OR ENTER ADDRESS<\u002Fspan><span class=\"a1 u\">youtube.com<\u002Fspan><span class=\"a2 u\">instagram.com<\u002Fspan>\n            <\u002Fdiv>\n            <div class=\"act\">SAVE<\u002Fdiv><div class=\"act x\">BOOKMARKS<\u002Fdiv><div class=\"act x\">HISTORY<\u002Fdiv><div class=\"act x\">DOWNLOADS<\u002Fdiv><div class=\"blk\"><span>BLOCKED<\u002Fspan><span><span class=\"t0\">4<\u002Fspan><span class=\"t1\">6<\u002Fspan><span class=\"t2\">5<\u002Fspan><span class=\"z\">0<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"body\">\n            <div class=\"sd\">\n              <div class=\"sh\"><span>TABS<\u002Fspan><span class=\"nw\">+ NEW<\u002Fspan><\u002Fdiv>\n              <label class=\"tab tab0\" for=\"bwt0\"><span>NEW TAB<span class=\"sl\"> [SLEEPING]<\u002Fspan><\u002Fspan><span class=\"x\">×<\u002Fspan><\u002Flabel>\n              <label class=\"tab tab1\" for=\"bwt1\"><span>YOUTUBE<span class=\"sl\"> [SLEEPING]<\u002Fspan><\u002Fspan><span class=\"x\">×<\u002Fspan><\u002Flabel>\n              <label class=\"tab tab2\" for=\"bwt2\"><span>INSTAGRAM<span class=\"sl\"> [SLEEPING]<\u002Fspan><\u002Fspan><span class=\"x\">×<\u002Fspan><\u002Flabel>\n              <div class=\"sp\"><\u002Fdiv>\n              <div class=\"row\" style=\"border-top:1px solid var(--l)\"><span>TRACKING PROTECTION<\u002Fspan><\u002Fdiv>\n              <label class=\"row shl\" for=\"bws\"><span>BUTANE SHIELD<\u002Fspan><i><span class=\"son\">ON<\u002Fspan><span class=\"soff\">OFF<\u002Fspan><\u002Fi><\u002Flabel>\n              <div class=\"row\"><span style=\"font-size:7px\">WEBVIEW PROTECTION<\u002Fspan><i>BALANCED<\u002Fi><\u002Fdiv>\n              <div class=\"row rc\">ALLOW CURRENT SITE<\u002Fdiv>\n              <div class=\"row rs\">SETTINGS<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"pg\">\n              <div class=\"p p0\"><div class=\"big\">BUTANE<\u002Fdiv><div class=\"sub\">NORMAL REMEMBERS YOU ON SITES YOU VISIT, BUT BLOCKS TRACKERS.<br>TYPE IN THE BAR ABOVE TO START<\u002Fdiv><\u002Fdiv>\n              <div class=\"p p1\"><div class=\"sk\"><div class=\"h\">youtube.com<\u002Fdiv><div class=\"ln\" style=\"width:100%\"><\u002Fdiv><div class=\"ln\" style=\"width:86%\"><\u002Fdiv><div class=\"ln\" style=\"width:94%\"><\u002Fdiv><div class=\"bk\"><span class=\"live\">AD REQUESTS BLOCKED<\u002Fspan><span class=\"gone\">TRACKERS ALLOWED<\u002Fspan><\u002Fdiv><div class=\"ln\" style=\"width:90%;margin-top:14px\"><\u002Fdiv><div class=\"ln\" style=\"width:62%\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n              <div class=\"p p2\"><div class=\"sk\"><div class=\"h\">instagram.com<\u002Fdiv><div class=\"ln\" style=\"width:92%\"><\u002Fdiv><div class=\"ln\" style=\"width:100%\"><\u002Fdiv><div class=\"ln\" style=\"width:70%\"><\u002Fdiv><div class=\"bk\"><span class=\"live\">TRACKER REQUESTS BLOCKED<\u002Fspan><span class=\"gone\">TRACKERS ALLOWED<\u002Fspan><\u002Fdiv><div class=\"ln\" style=\"width:84%;margin-top:14px\"><\u002Fdiv><div class=\"ln\" style=\"width:58%\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"bt\"><div class=\"st\"><span class=\"s0\">READY<\u002Fspan><span class=\"s1\">DONE<\u002Fspan><\u002Fdiv><div class=\"b bk1\">BACK<\u002Fdiv><div class=\"b\">FORWARD<\u002Fdiv><div class=\"b on\">RELOAD<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding: 10px 2px 0; font-size: 11px; color: #8c8c8c; font-weight:400; text-transform:none; letter-spacing:0\">Interface preview with sample pages. Click the tabs and BUTANE SHIELD.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- Features -->\n  <section id=\"features\" style=\"border-bottom: 1px solid #2a2a2a\">\n    <div style=\"max-width: 1280px; margin: 0 auto; padding: clamp(40px, 6vw, 72px) clamp(16px, 4vw, 48px); display: flex; flex-direction: column; gap: 28px\">\n      <div style=\"display: flex; flex-direction: column; gap: 10px\">\n        <div style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: #8c8c8c\">FEATURES<\u002Fdiv>\n        <h2 style=\"margin: 0; font-size: clamp(1.3rem, 2.8vw, 2rem); font-weight: 800; line-height: 1.1; letter-spacing: -0.01em; max-width: 26ch; text-wrap: balance\">BUILT AROUND TWO THINGS: SPEED AND PRIVACY.<\u002Fh2>\n      <\u002Fdiv>\n\n      <div style=\"display: flex; flex-direction: column\">\n        <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 28px; padding: 22px 0; border-top: 1px solid #2a2a2a\">\n          <div style=\"flex: 0 0 200px; font-weight: 700; letter-spacing: 0.04em\">BLOCKS FIRST<\u002Fdiv>\n          <div style=\"flex: 1 1 300px; min-width: 0; color: #c4c4c4\">Butane Shield blocks requests to known ad and tracker hosts. The BLOCKED counter shows what never reached you. ALLOW CURRENT SITE lets one site through. Today it uses a built-in starter list.<\u002Fdiv>\n          <div style=\"flex: 0 0 100px\"><span style=\"padding: 2px 8px; background: #ffffff; color: #111111; font-size: 10px; font-weight: 800; letter-spacing: 0.08em\">LIVE<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 28px; padding: 22px 0; border-top: 1px solid #2a2a2a\">\n          <div style=\"flex: 0 0 200px; font-weight: 700; letter-spacing: 0.04em\">TABS ON THE SIDE<\u002Fdiv>\n          <div style=\"flex: 1 1 300px; min-width: 0; color: #c4c4c4\">Tabs run down the left with readable titles. One click switches, one click closes, and the top bar stays clear for the address.<\u002Fdiv>\n          <div style=\"flex: 0 0 100px\"><span style=\"padding: 2px 8px; background: #ffffff; color: #111111; font-size: 10px; font-weight: 800; letter-spacing: 0.08em\">LIVE<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 28px; padding: 22px 0; border-top: 1px solid #2a2a2a\">\n          <div style=\"flex: 0 0 200px; font-weight: 700; letter-spacing: 0.04em\">PRIVATE WINDOW<\u002Fdiv>\n          <div style=\"flex: 1 1 300px; min-width: 0; color: #c4c4c4\">A separate window with an isolated, in-memory session. Closing it discards the session. Websites and your network can still see your visit.<\u002Fdiv>\n          <div style=\"flex: 0 0 100px\"><span style=\"padding: 2px 8px; background: #ffffff; color: #111111; font-size: 10px; font-weight: 800; letter-spacing: 0.08em\">LIVE<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 28px; padding: 22px 0; border-top: 1px solid #2a2a2a\">\n          <div style=\"flex: 0 0 200px; font-weight: 700; letter-spacing: 0.04em\">SETTINGS<\u002Fdiv>\n          <div style=\"flex: 1 1 300px; min-width: 0; color: #c4c4c4\">Turn Butane Shield on or off and pick WebView2 tracking prevention: Off, Basic, Balanced or Strict. Optionally clear cookies when the last normal window closes.<\u002Fdiv>\n          <div style=\"flex: 0 0 100px\"><span style=\"padding: 2px 8px; background: #ffffff; color: #111111; font-size: 10px; font-weight: 800; letter-spacing: 0.08em\">LIVE<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 28px; padding: 22px 0; border-top: 1px solid #2a2a2a\">\n          <div style=\"flex: 0 0 200px; font-weight: 700; letter-spacing: 0.04em\">SLEEPING TABS<\u002Fdiv>\n          <div style=\"flex: 1 1 300px; min-width: 0; color: #c4c4c4\">Background tabs are suspended to cut activity and memory use. Select a sleeping tab and it resumes. A tab stays awake while one of its popups is open.<\u002Fdiv>\n          <div style=\"flex: 0 0 100px\"><span style=\"padding: 2px 8px; background: #ffffff; color: #111111; font-size: 10px; font-weight: 800; letter-spacing: 0.08em\">LIVE<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 28px; padding: 22px 0; border-top: 1px solid #2a2a2a\">\n          <div style=\"flex: 0 0 200px; font-weight: 700; letter-spacing: 0.04em\">KEYBOARD SHORTCUTS<\u002Fdiv>\n          <div style=\"flex: 1 1 300px; min-width: 0; color: #c4c4c4\">Ctrl+T, Ctrl+W, Ctrl+N, Ctrl+Shift+N, Ctrl+Tab, Ctrl+1 to 9, Ctrl+L and Ctrl+D. Your hands stay on the keyboard.<\u002Fdiv>\n          <div style=\"flex: 0 0 100px\"><span style=\"padding: 2px 8px; background: #ffffff; color: #111111; font-size: 10px; font-weight: 800; letter-spacing: 0.08em\">LIVE<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 28px; padding: 22px 0; border-top: 1px solid #2a2a2a\">\n          <div style=\"flex: 0 0 200px; font-weight: 700; letter-spacing: 0.04em\">BOOKMARKS<\u002Fdiv>\n          <div style=\"flex: 1 1 300px; min-width: 0; color: #c4c4c4\">Save a page with SAVE or Ctrl+D and manage saved pages from the bookmarks library.<\u002Fdiv>\n          <div style=\"flex: 0 0 100px\"><span style=\"padding: 2px 8px; background: #ffffff; color: #111111; font-size: 10px; font-weight: 800; letter-spacing: 0.08em\">LIVE<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 28px; padding: 22px 0; border-top: 1px solid #2a2a2a\">\n          <div style=\"flex: 0 0 200px; font-weight: 700; letter-spacing: 0.04em\">HISTORY<\u002Fdiv>\n          <div style=\"flex: 1 1 300px; min-width: 0; color: #c4c4c4\">Normal-window visits are listed in HISTORY, where you can reopen, remove or clear them. Private windows are never recorded.<\u002Fdiv>\n          <div style=\"flex: 0 0 100px\"><span style=\"padding: 2px 8px; background: #ffffff; color: #111111; font-size: 10px; font-weight: 800; letter-spacing: 0.08em\">LIVE<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 28px; padding: 22px 0; border-top: 1px solid #2a2a2a\">\n          <div style=\"flex: 0 0 200px; font-weight: 700; letter-spacing: 0.04em\">DOWNLOADS<\u002Fdiv>\n          <div style=\"flex: 1 1 300px; min-width: 0; color: #c4c4c4\">Files save to your Downloads folder and appear in DOWNLOADS with progress, cancel, open and show in folder.<\u002Fdiv>\n          <div style=\"flex: 0 0 100px\"><span style=\"padding: 2px 8px; background: #ffffff; color: #111111; font-size: 10px; font-weight: 800; letter-spacing: 0.08em\">LIVE<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 28px; padding: 22px 0; border-top: 1px solid #2a2a2a\">\n          <div style=\"flex: 0 0 200px; font-weight: 700; letter-spacing: 0.04em\">SIGN-IN POPUPS<\u002Fdiv>\n          <div style=\"flex: 1 1 300px; min-width: 0; color: #c4c4c4\">Website popups open as linked tabs, so Sign in with Google and similar flows can report back to the page that opened them.<\u002Fdiv>\n          <div style=\"flex: 0 0 100px\"><span style=\"padding: 2px 8px; background: #ffffff; color: #111111; font-size: 10px; font-weight: 800; letter-spacing: 0.08em\">LIVE<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 28px; padding: 22px 0; border-top: 1px solid #2a2a2a; border-bottom: 1px solid #2a2a2a\">\n          <div style=\"flex: 0 0 200px; font-weight: 700; letter-spacing: 0.04em\">NO AI<\u002Fdiv>\n          <div style=\"flex: 1 1 300px; min-width: 0; color: #c4c4c4\">Nothing summarizes, suggests or listens in the background. Butane loads the page and gets out of the way.<\u002Fdiv>\n          <div style=\"flex: 0 0 100px\"><span style=\"padding: 2px 8px; background: #ffffff; color: #111111; font-size: 10px; font-weight: 800; letter-spacing: 0.08em\">BY DESIGN<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- Windows -->\n  <section id=\"windows\" style=\"border-bottom: 1px solid #2a2a2a\">\n    <div style=\"max-width: 1280px; margin: 0 auto; padding: clamp(40px, 6vw, 72px) clamp(16px, 4vw, 48px); display: flex; flex-direction: column; gap: 28px\">\n      <div style=\"display: flex; flex-direction: column; gap: 10px\">\n        <div style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: #8c8c8c\">NORMAL AND PRIVATE<\u002Fdiv>\n        <h2 style=\"margin: 0; font-size: clamp(1.3rem, 2.8vw, 2rem); font-weight: 800; line-height: 1.1; letter-spacing: -0.01em; max-width: 26ch; text-wrap: balance\">TWO WINDOWS. TWO RULES.<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-wrap: wrap\">\n        <div style=\"flex: 1 1 340px; min-width: 0; box-sizing: border-box; border: 1px solid #2a2a2a; padding: clamp(22px, 3vw, 36px); display: flex; flex-direction: column; gap: 16px\">\n          <div style=\"font-size: 12px; font-weight: 800; letter-spacing: 0.08em\">NORMAL WINDOW<\u002Fdiv>\n          <div style=\"font-size: 18px; font-weight: 700; line-height: 1.3\">Remembers you where it helps.<\u002Fdiv>\n          <div style=\"border-top: 1px solid #2a2a2a; padding-top: 14px; color: #c4c4c4\">First-party cookies stay, so logins, carts and settings last for days.<\u002Fdiv>\n          <div style=\"border-top: 1px solid #2a2a2a; padding-top: 14px; color: #c4c4c4\">WebView2 tracking prevention and Butane Shield limit known trackers.<\u002Fdiv>\n          <div style=\"border-top: 1px solid #2a2a2a; padding-top: 14px; color: #c4c4c4\">Settings let you change the shield and tracking prevention level.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex: 1 1 340px; min-width: 0; box-sizing: border-box; border: 1px solid #ffffff; background: #ffffff; color: #111111; padding: clamp(22px, 3vw, 36px); display: flex; flex-direction: column; gap: 16px\">\n          <div style=\"font-size: 12px; font-weight: 800; letter-spacing: 0.08em\">PRIVATE WINDOW<\u002Fdiv>\n          <div style=\"font-size: 18px; font-weight: 700; line-height: 1.3\">Remembers nothing.<\u002Fdiv>\n          <div style=\"border-top: 1px solid #c9c9cf; padding-top: 14px\">The session lives in memory and is discarded when the window closes.<\u002Fdiv>\n          <div style=\"border-top: 1px solid #c9c9cf; padding-top: 14px\">Every tab in the window shares one temporary session.<\u002Fdiv>\n          <div style=\"border-top: 1px solid #c9c9cf; padding-top: 14px; color: #4a4a52\">Private stops Butane from saving data on your computer. Websites and your network can still see your visit.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- Roadmap -->\n  <section id=\"roadmap\" style=\"border-bottom: 1px solid #2a2a2a\">\n    <div style=\"max-width: 1280px; margin: 0 auto; padding: clamp(40px, 6vw, 72px) clamp(16px, 4vw, 48px); display: flex; flex-direction: column; gap: 28px\">\n      <div style=\"display: flex; flex-direction: column; gap: 10px\">\n        <div style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: #8c8c8c\">ROADMAP<\u002Fdiv>\n        <h2 style=\"margin: 0; font-size: clamp(1.3rem, 2.8vw, 2rem); font-weight: 800; line-height: 1.1; letter-spacing: -0.01em; max-width: 26ch; text-wrap: balance\">WHAT IS BUILT AND WHAT IS NEXT.<\u002Fh2>\n      <\u002Fdiv>\n\n      <div style=\"display: flex; flex-direction: column\">\n        <div style=\"display: flex; flex-wrap: wrap; gap: 14px 28px; padding: 22px 0; border-top: 1px solid #2a2a2a;\">\n          <div style=\"flex: 0 0 140px\"><span style=\"padding: 2px 8px; background: #ffffff; color: #111111; font-size: 10px; font-weight: 800; letter-spacing: 0.08em\">LIVE<\u002Fspan><\u002Fdiv>\n          <div style=\"flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 4px\">\n            <span>Tabs on the side, with sleeping background tabs<\u002Fspan>\n            <span>Butane Shield and the BLOCKED counter<\u002Fspan>\n            <span>Normal and Private windows<\u002Fspan>\n            <span>DuckDuckGo search and web addresses in one bar<\u002Fspan>\n            <span>Bookmarks, history and a downloads manager<\u002Fspan>\n            <span>Linked popup tabs for sign-in flows<\u002Fspan>\n            <span>Settings: shield, tracking prevention level, cookie cleanup<\u002Fspan>\n            <span>Keyboard shortcuts<\u002Fspan>\n            <span>Windows installer<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 14px 28px; padding: 22px 0; border-top: 1px solid #2a2a2a; border-bottom: 1px solid #2a2a2a\">\n          <div style=\"flex: 0 0 140px\"><span style=\"padding: 2px 8px; border: 1px solid #5a5a5a; color: #8c8c8c; font-size: 10px; font-weight: 800; letter-spacing: 0.08em\">NEXT<\u002Fspan><\u002Fdiv>\n          <div style=\"flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 4px\">\n            <span>Full EasyList and EasyPrivacy filter lists<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"max-width: 62ch; color: #8c8c8c\">Butane runs on WebView2, the Microsoft Edge engine, so websites behave the way they do in Edge. The speed and privacy come from what Butane blocks and how it manages tabs.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- Download -->\n  <section id=\"download\" style=\"border-bottom: 1px solid #2a2a2a\">\n    <div style=\"max-width: 1280px; margin: 0 auto; padding: clamp(48px, 7vw, 96px) clamp(16px, 4vw, 48px); display: flex; flex-direction: column; gap: 22px\">\n      <div style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: #8c8c8c\">DOWNLOAD<\u002Fdiv>\n      <h2 style=\"margin: 0; font-size: clamp(1.8rem, 4.2vw, 3.4rem); font-weight: 800; line-height: 1.05; letter-spacing: -0.02em; max-width: 20ch; text-wrap: balance\">GET BUTANE FOR WINDOWS.<\u002Fh2>\n      <p style=\"margin: 0; max-width: 52ch; color: #c4c4c4\">Version 1.0.0 for Windows 10 and 11 (64-bit). The .NET runtime is included. Butane needs the Microsoft Edge WebView2 Runtime, which is already on most Windows 10 and 11 PCs.<\u002Fp>\n      <div style=\"display: flex; flex-wrap: wrap; gap: 12px\">\n        <a href=\"https://github.com/buildwithutkarsh-cpu/Butane/releases/latest\" target=\"_
